<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/code.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="preload" href="https://luke.hsiao.dev/fonts/Berkeley Mono Variable.woff2" as="font" type="font/woff2" crossorigin="">
</head>
<body>
    <header>
        <h1 class="title"><a href="{{ '/' | relative_url }}"><img src="{{ '/assets/favicon-white.svg' | relative_url }}" class="icon"> <span>mathias</span></a></h1>
    </header>

    <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/archives/' | relative_url }}">Archives</a>
    </nav>
    
    <main>{{ content }}</main>

    <footer>
        Subscribe via <a href="{{ '/feed.xml' | relative_url }}">rss</a><br>
        <small>Built on <a href="https://github.com/MathiasDPX/starblog/commit/{{ site.env.JEKYLL_COMMIT_SHA | default: 'unknown' }}">{{ site.env.JEKYLL_COMMIT_SHA | default: "unknown" | slice: 0, 7 }}</a></small>
    </footer>
</body>
</html>
